[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfakebench"
version = "2.0.0"
description = "A Comprehensive Benchmark of Deepfake Detection - Upgraded for PyTorch 2.x"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "CC BY-NC 4.0"}
authors = [
    {name = "Zhiyuan Yan", email = ""},
    {name = "Ahmed ElBamby", email = "ahmedelbamby1102003@gmail.com"},
]
maintainers = [
    {name = "Ahmed ElBamby", email = "ahmedelbamby1102003@gmail.com"},
]
keywords = [
    "deepfake",
    "detection",
    "computer-vision",
    "deep-learning",
    "pytorch",
    "face-forgery",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy>=1.21.6,<2.0",
    "pandas>=1.3.5,<2.0",
    "scipy>=1.7.3",
    "Pillow>=9.0.1",
    "opencv-python>=4.6.0",
    "scikit-image>=0.19.3",
    "scikit-learn>=1.0.2",
    "imageio>=2.9.0",
    "imgaug>=0.4.0",
    "albumentations>=1.1.0",
    "torch>=1.12.0",
    "torchvision>=0.13.0",
    "efficientnet-pytorch>=0.7.1",
    "timm>=0.6.13",
    "tensorboard>=2.10.1",
    "tqdm>=4.60.0",
    "pyyaml>=6.0",
    "imutils>=0.5.4",
    "seaborn>=0.11.2",
    "einops",
    "kornia",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
]
transformers = [
    "transformers>=4.30.2",
    "tokenizers>=0.11,<0.14",
    "regex",
]
all = [
    "deepfakebench[dev,transformers]",
    "loralib",
    "filterpy",
    "simplejson",
    "fvcore",
]

[project.urls]
Homepage = "https://github.com/ahmedelbamby-aast/DeepFakeBenchUpgraded"
Documentation = "https://github.com/ahmedelbamby-aast/DeepFakeBenchUpgraded/blob/main/README.md"
Repository = "https://github.com/ahmedelbamby-aast/DeepFakeBenchUpgraded"
"Bug Tracker" = "https://github.com/ahmedelbamby-aast/DeepFakeBenchUpgraded/issues"
Original = "https://github.com/SCLBD/DeepfakeBench"

[project.scripts]
deepfakebench-train = "deepfakebench.train:main"
deepfakebench-test = "deepfakebench.test:main"

[tool.setuptools]
packages = ["deepfakebench"]

[tool.setuptools.package-data]
deepfakebench = ["config/**/*.yaml", "pretrained/**/*"]
