# ============================================
# DeepFakeBench Conda Environment - Minimal
# ============================================
# 
# Usage:
#   conda env create -f environment-minimal.yml
#   conda activate deepfakebench-minimal
#
# Minimal environment for inference only
# ============================================

name: deepfakebench-minimal
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python>=3.8,<3.12
  
  # Core packages only
  - numpy>=1.21.6,<2.0
  - pillow>=9.0.1
  - opencv>=4.6.0
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - pytorch-cuda=11.8
  - pyyaml>=6.0
  - tqdm>=4.60.0
  
  - pip:
    - efficientnet-pytorch>=0.7.1
    - timm>=0.6.13
    - albumentations>=1.1.0
